apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-audit
  namespace: parqueaderos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-audit
  template:
    metadata:
      labels:
        app: postgres-audit
    spec:
      containers:
      - name: postgres-audit
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "db_audit"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "123456"
        volumeMounts:
        - name: postgres-audit-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: postgres-audit-storage
        persistentVolumeClaim:
          claimName: postgres-audit-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-audit-pvc
  namespace: parqueaderos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-audit
  namespace: parqueaderos
spec:
  selector:
    app: postgres-audit
  ports:
  - port: 5432
    targetPort: 5432
