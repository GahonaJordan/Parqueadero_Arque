apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehiculo
  namespace: parqueaderos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vehiculo
  template:
    metadata:
      labels:
        app: vehiculo
    spec:
      containers:
      - name: vehiculo
        image: vehiculo:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: DB_HOST
          value: "postgres-vehiculo"
        - name: DB_PORT
          value: "5432"
        - name: DB_USUARIO
          value: "postgres"
        - name: DB_CONTRASENA
          value: "123456"
        - name: DB_NOMBRE
          value: "vehiculos_db"
        - name: JWT_SECRET
          value: "parcial2-arqui-jwt-secret-key-2026-min-256-bits!!"
        - name: INTERNAL_API_KEY
          value: "internal-service-key-parcial2"
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          value: "admin"
        - name: RABBITMQ_PASSWORD
          value: "admin123"
        - name: RABBITMQ_QUEUE
          value: "queue_audit"
        - name: RABBITMQ_EXCHANGE
          value: "exchange_audit"
        - name: RABBITMQ_ROUTING_KEY
          value: "routing_audit"
        - name: THROTTLE_TTL
          value: "60"
        - name: THROTTLE_LIMIT
          value: "10"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: MS_AUTH_VALIDATE
          value: "http://usuarios:9090/api/auth/validate"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: vehiculo
  namespace: parqueaderos
spec:
  selector:
    app: vehiculo
  ports:
  - port: 3001
    targetPort: 3001
