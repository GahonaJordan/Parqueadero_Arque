spring.application.name=usuarios

server.address=0.0.0.0
server.port=${SERVER_PORT:9090}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/usuarios_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

auth.internal-api-key=${INTERNAL_API_KEY:internal-service-key-parcial2}
auth.jwt.secret=${JWT_SECRET:parcial2-arqui-jwt-secret-key-2026-min-256-bits!!}
auth.jwt.expiration-ms=${JWT_EXPIRATION_MS:600000}

# Cuenta administrativa inicial. Se crea solo cuando no existe el username configurado.
bootstrap.super-admin.username=${SUPER_ADMIN_USERNAME:superadmin}
bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD:SuperAdmin123}

# Redis cache compartido (SaaS)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

logging.level.org.springframework.security=DEBUG
