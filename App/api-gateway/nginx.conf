# Legacy Nginx gateway (referencia).
# El despliegue activo usa Kong (ver kong.yml + Dockerfile).
# Mantener este archivo solo como documentación de rutas equivalentes.

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/json;
  sendfile      on;

  upstream ms_usuarios { server usuarios:9090; }
  upstream ms_zonas { server zonas-espacios:8081; }
  upstream ms_tickets { server tickets:3000; }
  upstream ms_vehiculo { server vehiculo:3001; }
  upstream ms_audit { server ms-audit:3004; }

  server {
    listen 8080;
    server_name _;

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","gateway":"nginx-legacy","hint":"use Kong"}';
    }

    location /api/auth/ { proxy_pass http://ms_usuarios; }
    location /api/users { proxy_pass http://ms_usuarios; }
    location /api/roles { proxy_pass http://ms_usuarios; }
    location /api/zonas { proxy_pass http://ms_zonas; }
    location /api/espacios { proxy_pass http://ms_zonas; }
    location /tickets { proxy_pass http://ms_tickets; }
    location /sse/ {
      proxy_pass http://ms_tickets;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
    location /vehiculo { proxy_pass http://ms_vehiculo; }
    location /audit { proxy_pass http://ms_audit; }
  }
}
